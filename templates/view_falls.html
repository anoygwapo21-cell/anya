<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Waterfalls in Cebu</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #e6f7ff; margin: 0; }
        header { background: #0096c7; color: white; padding: 20px; text-align: center; }
        .spot-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 40px; }
        .spot-card { background: white; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); overflow: hidden; transition: 0.3s; }
        .spot-card:hover { transform: scale(1.03); }
        .spot-card img { width: 100%; height: 220px; object-fit: cover; }
        .spot-info { padding: 15px; }
        h2, p { margin: 0; }
        .back { display: block; text-align: center; margin: 30px; color: #0096c7; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<header><h1>💦 Famous Waterfalls in Cebu</h1></header>

<div class="spot-container">
    <div class="spot-card">
        <img src="{{ url_for('static', filename='kawasan.jpg') }}">
        <div class="spot-info">
            <h2>Kawasan Falls</h2>
            <p>Turquoise waters perfect for swimming and canyoneering adventures.</p>
        </div>
    </div>
    <div class="spot-card">
        <img src="{{ url_for('static', filename='tumalog.jpg') }}">
        <div class="spot-info">
            <h2>Tumalog Falls</h2>
            <p>A gentle curtain-like waterfall with a serene atmosphere.</p>
        </div>
    </div>
    <div class="spot-card">
        <img src="{{ url_for('static', filename='mantayupan.jpg') }}">
        <div class="spot-info">
            <h2>Mantayupan Falls</h2>
            <p>One of the tallest waterfalls in Cebu located in Barili.</p>
        </div>
    </div>
</div>

<a href="{{ url_for('home') }}" class="back">← Back to Categories</a>
</body>
</html>
