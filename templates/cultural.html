<body class="bg" style="background-image: url('{{ url_for('static', filename='images/cultural.jpg') }}');">

        <h1>Cultural & Historical Sites of Cebu</h1>
        <nav>
            <a href="{{ url_for('home') }}">Back to Home</a>

    <div class="spots">
        <div class="spot-card">
            <img src="{{ url_for('static', filename='images/magellan.jpg') }}">
            <h3>Magellan’s Cross</h3>
            <p>A historical landmark marking the arrival of Christianity in Cebu.</p>

        <div class="spot-card">
            <img src="{{ url_for('static', filename='images/santonino.jpg') }}">
            <h3>Basilica del Santo Niño</h3>
            <p>The oldest Roman Catholic church in the Philippines.</p>
        </div>

        <div class="spot-card">
            <img src="{{ url_for('static', filename='images/fortsanpedro.jpg') }}">
