{% extends "base.html" %}
{% block content %}
  <h1>New Tourist Spot</h1>
  <form method="post">
    <label>Category: <input name="category"></label><br>
    <label>Name: <input name="name" required></label><br>
    <label>Location: <input name="location"></label><br>
    <label>Image filename (in static/): <input name="image"></label><br>
    <label>Description:<br><textarea name="description" rows="6"></textarea></label><br>
    <button type="submit">Create</button>
  </form>
{% endblock %}
