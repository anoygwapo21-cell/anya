{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2 class="mb-4">Edit Spot</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Category</label>
            <input type="text" name="category" class="form-control" value="{{ spot.category }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" value="{{ spot.name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" name="location" class="form-control" value="{{ spot.location }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" required>{{ spot.description }}</textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Image Filename</label>
            <input type="text" name="image" class="form-control" value="{{ spot.image }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
