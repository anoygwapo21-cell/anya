<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title if title else "Tourism Explorer" }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="bg-overlay"></div>

    <header class="py-3 border-bottom bg-transparent shadow-sm position-relative">
        <div class="container d-flex justify-content-between align-items-center">
            <h3 class="fw-bold text-light">Tourism Explorer</h3>
            <div>
                {% if session.get('logged_in') %}
                    <a href="{{ url_for('index') }}" class="btn btn-outline-light me-2">Home</a>
                    <a href="{{ url_for('about') }}" class="btn btn-outline-light me-2">About Us</a>
                    <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
                {% else %}
                    <a href="{{ url_for('login') }}" class="btn btn-outline-light me-2">Login</a>
                    <a href="{{ url_for('register') }}" class="btn btn-primary">Register</a>
                {% endif %}
            </div>
        </div>
    </header>

    <main class="container py-5 position-relative z-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-4 bg-transparent position-relative z-1">
        <p class="text-light mb-0">&copy; 2025 Tourism Explorer | Designed with ❤️ by Anya</p>
    </footer>
</body>
</html>
